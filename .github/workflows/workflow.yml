name: Main workflow
on: [push, pull_request]
jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.6, 3.7, 3.8]
    steps:
      - uses: actions/checkout@v2
      - name: Install
        uses: abatilo/actions-poetry@v1.5.0
        with:
          python_version: ${{ matrix.pythin-version }}
          args: install
      - name: Run pytest
        uses: abatilo/actions-poetry@v1.5.0
        with:
          args: run python -m pytest
